[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-activity-detection-claim-audit"
version = "0.1.0"
description = "Offline static documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
voice-activity-detection-claim-audit = "voice_activity_detection_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["voice_activity_detection_claim_audit*", "tests"]
